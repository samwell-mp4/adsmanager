<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ads Manager CRM Collector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 350px;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 12px;
    }
    .icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .badge-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .field {
      margin-bottom: 10px;
    }
    .label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      color: #f8fafc;
      font-size: 11px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-sync {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .btn-sync:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
    .btn-n8n {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
    }
    .btn-n8n:hover {
      background: #c2410c;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .status-box {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #020617;
      border: 1px solid #1e293b;
      font-size: 11px;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #94a3b8;
    }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
      border-top: 1px solid #1e293b;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">💬</div>
    <div>
      <h1 class="title">Ads Manager CRM</h1>
      <p class="subtitle">Agente Coletor de Mensagens & Webhook</p>
    </div>
  </div>

  <div class="badge">
    <div class="badge-left">
      <span class="badge-dot"></span>
      <span id="statusText">Monitor Ativo (Facebook / OLX)</span>
    </div>
    <span id="lastSyncTime" style="font-size: 10px; color: #94a3b8;">--:--</span>
  </div>

  <div class="field">
    <label class="label">🌐 Servidor Ads Manager:</label>
    <input type="text" id="apiUrlInput" placeholder="https://adsmanager-adsmanagerapp.ahzgvk.easypanel.host">
  </div>

  <div class="field">
    <label class="label">⚡ Webhook n8n Externo:</label>
    <input type="text" id="n8nWebhookInput" placeholder="https://plug-sales-dispatch-app-n8n-2.hx8235.easypanel.host/webhook/adsmanager">
  </div>

  <div class="field">
    <label class="label">👤 ID do Perfil no Ads Manager:</label>
    <input type="number" id="profileIdInput" value="1">
  </div>

  <div class="btn-group">
    <button id="syncNowBtn" class="btn-sync">
      <span>⚡</span>
      <span>Sincronizar Agora (Gatilho Manual)</span>
    </button>
    <button id="testN8nBtn" class="btn-n8n">
      <span>📡</span>
      <span>Testar Disparo para Webhook n8n</span>
    </button>
    <div style="display: flex; gap: 6px;">
      <button id="testApiBtn" class="btn-secondary" style="flex: 1;">
        <span>🔌</span>
        <span>Testar Servidor</span>
      </button>
      <button id="saveBtn" class="btn-secondary" style="flex: 1;">
        <span>💾</span>
        <span>Salvar</span>
      </button>
    </div>
  </div>

  <div class="status-box" id="msgArea">
    Pronto para sincronizar mensagens.
  </div>

  <div class="footer">
    Ads Manager Multi-login Pro • v1.4.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
