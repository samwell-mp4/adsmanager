services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: browser-manager-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgres://adsmanager:Samuca03146555%40@adsmanager_adsmanager:5432/adsmanager?sslmode=disable}
      - PROFILES_DATA_DIR=/data/browser-profiles
      - BROWSER_IMAGE=browser-profile:latest
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/browser-profiles:/data/browser-profiles
    networks:
      - browser-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: browser-manager-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - browser-network

networks:
  browser-network:
    name: browser-network
    driver: bridge
